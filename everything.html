<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>这里什么都有</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
      gap: 2rem;
    }
    p {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1.5rem;
      color: #aaa;
    }
    button {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1rem;
      padding: 0.5rem 1.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #f5f5f5;
      color: #333;
    }

</head>
<body>
  <p>这里什么都有</p>
