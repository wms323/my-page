<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>520</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 30%, #fbc2eb 60%, #a18cd1 100%);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      user-select: none;
      cursor: pointer;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .main {
      text-align: center;
      z-index: 10;
      position: relative;
    }

    .number {
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 40px rgba(255,255,255,0.6), 0 4px 20px rgba(0,0,0,0.1);
      animation: float 3s ease-in-out infinite;
      letter-spacing: 0.05em;
    }

    .number span {
      display: inline-block;
      animation: bounce 1.5s ease-in-out infinite;
    }
    .number span:nth-child(1) { animation-delay: 0s; }
    .number span:nth-child(2) { animation-delay: 0.15s; }
    .number span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .subtitle {
      font-size: 1.2rem;
      color: rgba(255,255,255,0.85);
      margin-top: 0.5rem;
      letter-spacing: 0.2em;
      animation: fadeInOut 4s ease-in-out infinite;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .hint {
      position: fixed;
      bottom: 2rem;
      color: rgba(255,255,255,0.5);
      font-size: 0.85rem;
      animation: fadeInOut 3s ease-in-out infinite;
      z-index: 10;
    }

    .heart-particle {
      position: fixed;
      pointer-events: none;
      font-size: 1.5rem;
      animation: riseUp 4s ease-out forwards;
      z-index: 5;
    }

    @keyframes riseUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-100vh) scale(0.3) rotate(180deg);
      }
    }

    .counter {
      position: fixed;
      top: 2rem;
      right: 2rem;
      color: rgba(255,255,255,0.4);
      font-size: 0.8rem;
      z-index: 10;
    }

    .message-pop {
      position: fixed;
      pointer-events: none;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(255,255,255,0.8);
      animation: popUp 2s ease-out forwards;
      z-index: 15;
    }

    @keyframes popUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(0.5);
      }
      30% {
        opacity: 1;
        transform: translateY(-30px) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translateY(-120px) scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="main">
    <div class="number">
      <span>5</span><span>2</span><span>0</span>
    </div>
    <div class="subtitle">点击屏幕 &hearts;</div>
  </div>

  <div class="hint">点一下试试</div>
  <div class="counter" id="counter"></div>

  <script>
    const messages = [
      '喜欢你', '好喜欢你', '最喜欢你', '超喜欢你',
      '今天天气真好', '适合想你', '一直都在',
      '你好呀', '要开心', '每一天', '你是最棒的',
      '嘿嘿', '比心', 'Mua', '抱抱',
      '月亮代表我的心', '星星都亮了', '有人想你',
    ];

    let clickCount = 0;
    const body = document.body;
    const counterEl = document.getElementById('counter');
    const title = document.querySelector('.number');

    function randomBetween(a, b) { return Math.random() * (b - a) + a; }

    function spawnHeart(x, y) {
      const heart = document.createElement('div');
      heart.className = 'heart-particle';
      heart.textContent = ['💕','💖','💗','💝','💘','❤️','🩷','💓'][Math.floor(Math.random() * 8)];
      heart.style.left = x + 'px';
      heart.style.top = y + 'px';
      heart.style.fontSize = randomBetween(1, 2.5) + 'rem';
      heart.style.animationDuration = randomBetween(2.5, 5) + 's';
      body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }

    function spawnMessage(x, y) {
      const msg = document.createElement('div');
      msg.className = 'message-pop';
      msg.textContent = messages[Math.floor(Math.random() * messages.length)];
      msg.style.left = x + 'px';
      msg.style.top = y + 'px';
      body.appendChild(msg);
      setTimeout(() => msg.remove(), 2500);
    }

    function burstHearts(x, y, count) {
      for (let i = 0; i < count; i++) {
        const ox = randomBetween(-60, 60);
        const oy = randomBetween(-60, 0);
        setTimeout(() => spawnHeart(x + ox, y + oy), i * 40);
      }
    }

    body.addEventListener('click', (e) => {
      clickCount++;
      const x = e.clientX;
      const y = e.clientY;

      burstHearts(x, y, 6);

      if (clickCount % 5 === 0) {
        spawnMessage(x, y - 30);
      }

      if (clickCount <= 20) {
        counterEl.textContent = '❤️ x ' + clickCount;
      } else if (clickCount === 21) {
        counterEl.textContent = '够了够了，别点了';
      } else if (clickCount === 30) {
        counterEl.textContent = '你还点！';
      } else if (clickCount === 50) {
        counterEl.textContent = '好吧，520快乐 💕';
      } else if (clickCount === 100) {
        counterEl.textContent = '你赢了 🏆';
      } else if (clickCount >= 200) {
        counterEl.textContent = '❤️ x ' + clickCount + ' 你太执着了';
      }

      title.style.transform = 'scale(' + (1 + Math.min(clickCount % 10, 5) * 0.02) + ')';
      setTimeout(() => { title.style.transform = 'scale(1)'; }, 100);
    });

    // Floating background hearts
    setInterval(() => {
      const x = randomBetween(0, window.innerWidth);
      const y = window.innerHeight + 20;
      spawnHeart(x, y);
    }, 800);
  </script>
</body>
</html>
